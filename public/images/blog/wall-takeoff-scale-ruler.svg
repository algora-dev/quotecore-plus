<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="760" height="230" fill="#ffffff"/>
  <text x="40" y="34" font-size="17" font-weight="600" fill="#18181b">Architect's scale — 1/4&#8243; = 1&#8242;-0&#8243; (1:48)</text>
  <text x="40" y="56" font-size="13" fill="#71717a">Commonly used on residential floor plans: every 1/4 inch on paper represents 1 foot of the building.</text>

  <!-- ruler bar -->
  <rect x="140" y="110" width="480" height="34" fill="#fafafa" stroke="#a1a1aa" stroke-width="1.5"/>

  <!-- major ticks each foot (40px = 1 ft) -->
  <g stroke="#52525b" stroke-width="1.5">
    <line x1="140" y1="110" x2="140" y2="144"/>
    <line x1="180" y1="110" x2="180" y2="144"/>
    <line x1="220" y1="110" x2="220" y2="144"/>
    <line x1="260" y1="110" x2="260" y2="144"/>
    <line x1="300" y1="110" x2="300" y2="144"/>
    <line x1="340" y1="110" x2="340" y2="144"/>
    <line x1="380" y1="110" x2="380" y2="144"/>
    <line x1="420" y1="110" x2="420" y2="144"/>
    <line x1="460" y1="110" x2="460" y2="144"/>
    <line x1="500" y1="110" x2="500" y2="144"/>
    <line x1="540" y1="110" x2="540" y2="144"/>
    <line x1="580" y1="110" x2="580" y2="144"/>
    <line x1="620" y1="110" x2="620" y2="144"/>
  </g>
  <!-- minor ticks each 1/4 ft -->
  <g stroke="#a1a1aa" stroke-width="1">
    <line x1="150" y1="110" x2="150" y2="127"/><line x1="160" y1="110" x2="160" y2="127"/><line x1="170" y1="110" x2="170" y2="127"/>
    <line x1="190" y1="110" x2="190" y2="127"/><line x1="200" y1="110" x2="200" y2="127"/><line x1="210" y1="110" x2="210" y2="127"/>
    <line x1="230" y1="110" x2="230" y2="127"/><line x1="240" y1="110" x2="240" y2="127"/><line x1="250" y1="110" x2="250" y2="127"/>
    <line x1="270" y1="110" x2="270" y2="127"/><line x1="280" y1="110" x2="280" y2="127"/><line x1="290" y1="110" x2="290" y2="127"/>
    <line x1="310" y1="110" x2="310" y2="127"/><line x1="320" y1="110" x2="320" y2="127"/><line x1="330" y1="110" x2="330" y2="127"/>
    <line x1="350" y1="110" x2="350" y2="127"/><line x1="360" y1="110" x2="360" y2="127"/><line x1="370" y1="110" x2="370" y2="127"/>
    <line x1="390" y1="110" x2="390" y2="127"/><line x1="400" y1="110" x2="400" y2="127"/><line x1="410" y1="110" x2="410" y2="127"/>
    <line x1="430" y1="110" x2="430" y2="127"/><line x1="440" y1="110" x2="440" y2="127"/><line x1="450" y1="110" x2="450" y2="127"/>
    <line x1="470" y1="110" x2="470" y2="127"/><line x1="480" y1="110" x2="480" y2="127"/><line x1="490" y1="110" x2="490" y2="127"/>
    <line x1="510" y1="110" x2="510" y2="127"/><line x1="520" y1="110" x2="520" y2="127"/><line x1="530" y1="110" x2="530" y2="127"/>
    <line x1="550" y1="110" x2="550" y2="127"/><line x1="560" y1="110" x2="560" y2="127"/><line x1="570" y1="110" x2="570" y2="127"/>
    <line x1="590" y1="110" x2="590" y2="127"/><line x1="600" y1="110" x2="600" y2="127"/><line x1="610" y1="110" x2="610" y2="127"/>
  </g>

  <!-- foot numbers -->
  <g font-size="12" fill="#3f3f46" text-anchor="middle">
    <text x="140" y="162">0</text><text x="180" y="162">1</text><text x="220" y="162">2</text>
    <text x="260" y="162">3</text><text x="300" y="162">4</text><text x="340" y="162">5</text>
    <text x="380" y="162">6</text><text x="420" y="162">7</text><text x="460" y="162">8</text>
    <text x="500" y="162">9</text><text x="540" y="162">10</text><text x="580" y="162">11</text><text x="620" y="162">12</text>
  </g>
  <text x="638" y="162" font-size="12" fill="#71717a">ft</text>

  <!-- one-division dimension -->
  <line x1="180" y1="84" x2="220" y2="84" stroke="#BD4A1A" stroke-width="1.5"/>
  <line x1="180" y1="78" x2="180" y2="90" stroke="#BD4A1A" stroke-width="1.5"/>
  <line x1="220" y1="78" x2="220" y2="90" stroke="#BD4A1A" stroke-width="1.5"/>
  <text x="200" y="74" font-size="12" fill="#BD4A1A" text-anchor="middle">1 ft</text>

  <!-- conversion callout -->
  <text x="40" y="200" font-size="13" fill="#3f3f46">Quick rule: multiply the paper measurement in inches by 4 to get feet. 1&#8243; on paper = 4 ft, 6&#8243; = 24 ft, 12&#8243; = 48 ft.</text>
  <text x="40" y="220" font-size="11" fill="#a1a1aa">Illustrative diagram — not printed to exact scale.</text>
</svg>

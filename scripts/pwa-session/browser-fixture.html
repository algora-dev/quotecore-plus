<!doctype html><meta charset="utf-8"><title>Session recovery test fixture — not application UI</title>
<div id="status"></div><form id="form"><label>Email <input id="email"></label><button>Sign in</button></form>
<button id="retry">Check saved sign-in</button>
<script src="/fixture-bundle.js"></script>
<script>
// Real production controller + event bindings; minimal mock presentation. This
// is NOT evidence for React hydration, Next SSR, WebKit, or real PWA storage.
window.states=[];window.clock=Date.now();window.isHidden=false;
Object.defineProperty(document,'hidden',{get:()=>window.isHidden,configurable:true});
const form=document.getElementById('form');
const controller=QcpRecovery.createLoginRecovery({
 search:()=>new URLSearchParams(location.search),hash:()=>location.hash,
 visible:()=>!document.hidden,online:()=>navigator.onLine,now:()=>window.clock,
 readStorage:key=>sessionStorage.getItem(key),writeStorage:(key,value)=>sessionStorage.setItem(key,value),
 probe:async(destination,signal,trigger)=>{
  const response=await fetch('/api/auth/resume?redirect='+encodeURIComponent(destination),{credentials:'same-origin',cache:'no-store',redirect:'error',signal,headers:{'X-QCP-Resume-Trigger':trigger}});
  return response.json();
 },
 navigate:path=>location.replace(path),
 state:state=>{window.states.push(state);document.body.dataset.state=state;document.getElementById('status').textContent=state;form.hidden=state==='checking'||state==='navigating';},
});
window.control=controller;
window.detach=QcpRecovery.attachLoginRecoveryEvents(controller,window,document);
form.addEventListener('focusin',()=>controller.enteringCredentials());
form.addEventListener('pointerdown',()=>controller.enteringCredentials());
form.addEventListener('submit',e=>{e.preventDefault();controller.enteringCredentials();});
document.getElementById('retry').onclick=()=>controller.start('manual');
window.lifecycle=(kind)=>{
 window.clock+=3000;
 if(kind==='pageshow')window.dispatchEvent(new PageTransitionEvent('pageshow',{persisted:true}));
 if(kind==='online')window.dispatchEvent(new Event('online'));
 if(kind==='hide'||kind==='show'){window.isHidden=kind==='hide';document.dispatchEvent(new Event('visibilitychange'));}
};
void controller.start();
</script>

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>create-invoice</title><link rel="stylesheet" href="fixture.css"><style>body{margin:0;background:#f6f7f9;font-family:Arial,sans-serif}.specimen{max-width:1120px;margin:0 auto;padding:28px 24px}.specimen-note{font:11px/18px Arial;color:#596273;padding:8px 16px;background:#fff;border-bottom:1px solid #dde1e7}.specimen:has(.qc-flow-auth){max-width:none;padding:0}@media(max-width:767px){.specimen{padding:20px 16px}}</style><body><div class="specimen-note">SOURCE-DERIVED STATIC FIXTURE · sample data · no saving, sending or payments</div><main class="specimen"><dialog data-qc-ui="v2" data-qc-component="C27" data-qc-size="md" class="qc-dialog qc-journey-dialog" aria-modal="true" aria-labelledby="fixture-1"><div class="qc-dialog-body"><span id="fixture-1" class="qc-flow-sr-only">Create invoice</span><div class="qc-flow-dialog-content"><div class="bg-white rounded-2xl shadow-2xl w-full max-w-md border border-slate-200"><div class="flex items-center justify-between px-6 pt-5 pb-4 border-b border-slate-100"><div class="flex items-center gap-2"><h2 class="text-lg font-semibold text-slate-900">New Invoice</h2></div><button aria-label="Close" type="button" class="qc-icon-button qc-flow-control p-1.5 rounded text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-colors"><svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg></button></div><div class="px-6 py-5"><div class="space-y-3"><p class="text-sm text-slate-500 mb-4">How would you like to create this invoice?</p><button type="button" data-copilot="invoice-method-blank" data-assistant-id="invoice-method-blank" class="qc-flow-control qc-flow-card block w-full text-left p-4 bg-white border-2 border-slate-200 rounded-xl hover:border-[#FF6B35] hover:shadow-lg transition-all group"><div class="flex items-start gap-4"><div class="p-2 rounded-full bg-orange-50 group-hover:bg-orange-100 flex items-center justify-center flex-shrink-0 transition-colors"><svg class="h-5 w-5 text-[#FF6B35]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg></div><div><p class="font-semibold text-slate-900 text-sm">Blank Invoice</p><p class="text-xs text-slate-500 mt-0.5">Start from scratch - choose a template then build line items manually.</p></div></div></button><button type="button" data-copilot="invoice-method-from-quote" data-assistant-id="invoice-method-from-quote" class="qc-flow-control qc-flow-card block w-full text-left p-4 bg-white border-2 border-slate-200 rounded-xl hover:border-[#FF6B35] hover:shadow-lg transition-all group"><div class="flex items-start gap-4"><div class="p-2 rounded-full bg-orange-50 group-hover:bg-orange-100 flex items-center justify-center flex-shrink-0 transition-colors"><svg class="h-5 w-5 text-[#FF6B35]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg></div><div><p class="font-semibold text-slate-900 text-sm">From a Quote</p><p class="text-xs text-slate-500 mt-0.5">Pick a quote, then choose which lines to include.</p></div></div></button><div class="block w-full text-left p-4 bg-white border-2 border-slate-100 rounded-xl opacity-50 cursor-not-allowed" title="Coming soon"><div class="flex items-start gap-4"><div class="p-2 rounded-full bg-slate-100 flex items-center justify-center flex-shrink-0"><svg class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg></div><div><p class="font-semibold text-slate-700 text-sm">From a Job</p><p class="text-xs text-slate-400 mt-0.5">Coming soon - available once Jobs are live.</p></div></div></div></div></div></div></div></div></dialog></main><script>for(const d of document.querySelectorAll('dialog')){d.showModal();}</script></body></html>

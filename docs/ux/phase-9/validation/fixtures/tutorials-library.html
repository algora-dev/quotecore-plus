ript>document.querySelectorAll('dialog').forEach(d=>d.showModal());document.querySelectorAll('canvas').forEach(c=>{const x=c.getContext('2d');if(!x)return;x.fillStyle='#f8f9fa';x.fillRect(0,0,c.width,c.height);x.strokeStyle='#e6e8eb';x.lineWidth=1;for(let i=0;i<c.width;i+=25){x.beginPath();x.moveTo(i,0);x.lineTo(i,c.height);x.stroke()}for(let i=0;i<c.height;i+=25){x.beginPath();x.moveTo(0,i);x.lineTo(c.width,i);x.stroke()}x.font='14px system-ui';x.fillStyle='#596273';x.fillText('Static canvas placeholder. Drawing engine not exercised.',20,32)});</script></body></html>

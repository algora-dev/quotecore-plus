<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>angle-dialog</title><link rel="stylesheet" href="fixture.css"><style>body{margin:0;background:#f6f7f9}.specimen{max-width:1360px;margin:0 auto;padding:24px}.specimen-note{font:12px/18px Arial;color:#596273;padding:12px 16px;background:#fff;border-bottom:1px solid #dde1e7}.specimen-heading{font:600 26px/1.2 system-ui;margin:0 0 20px}canvas{background:#fff}@media(max-width:767px){.specimen{padding:20px 16px}}</style></head><body><div class="specimen-note">PHASE 9 SOURCE LAYOUT REVIEW · sample records · no live backend or drawing engine</div><main class="specimen" data-qc-ui="v2"><h1 class="specimen-heading">Angle calculator</h1><dialog data-qc-ui="v2" data-qc-component="C27" data-qc-size="sm" class="qc-dialog qc-journey-dialog" aria-modal="true" aria-labelledby="fixture-2"><div class="qc-dialog-body"><span id="fixture-2" class="qc-flow-sr-only">Calculate roof angle</span><div class="qc-flow-dialog-content"><div class="qc-angle-tool qc-angle-modal" data-qc-ui="v2"><h2 class="text-xl font-bold text-slate-900 mb-4">Auto-Calculate Roof Angle</h2><div class="mb-4"><label class="block text-sm font-medium text-slate-700 mb-2">Calculator Type</label><div class="space-y-2"><label class="flex items-center"><input type="radio" name="fixture-1-calcType" value="hipValley" checked class="mr-2"><span class="text-sm">Hip / Valley</span><span class="qc-tool-help" data-qc-ui="v2"><button aria-label="Help: Hip / Valley" aria-haspopup="dialog" type="button" data-qc-component="C01" data-qc-variant="ghost" data-qc-size="sm" class="qc-button qc-icon-button"><span aria-hidden="true">?</span></button></span></label><label class="flex items-center"><input type="radio" name="fixture-1-calcType" value="rafterPitch" class="mr-2"><span class="text-sm">Rafter Pitch</span><span class="qc-tool-help" data-qc-ui="v2"><button aria-label="Help: Rafter Pitch" aria-haspopup="dialog" type="button" data-qc-component="C01" data-qc-variant="ghost" data-qc-size="sm" class="qc-button qc-icon-button"><span aria-hidden="true">?</span></button></span></label></div></div><div class="h-px bg-slate-300 my-4"></div><div class="mb-4"><label class="block text-sm font-medium text-slate-700 mb-1">Roof Pitch 1 (°)</label><input type="number" aria-label="Roof pitch 1 in degrees" value="25" min="0" max="89" step="0.1" class="qc-input w-full"><p class="text-xs text-slate-400 mt-1">Enter the pitch of the first roof plane.</p></div><div class="mb-4"><label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="rounded border-slate-300"><span class="text-sm text-slate-700">Same as Roof Pitch 1</span></label></div><div class="mb-4"><label class="block text-sm font-medium text-slate-700 mb-1">Corner Angle (°)</label><input type="number" aria-label="Corner angle in degrees" value="90" min="1" max="180" step="0.1" class="qc-input w-full"><p class="text-xs text-slate-400 mt-1">Angle between the two roof lines. Usually 90°. Change only if the building corner is not square.</p></div><button type="button" data-qc-component="C01" data-qc-variant="primary" data-qc-size="md" class="qc-button w-full">Calculate</button><div class="flex gap-2 mt-4"><button type="button" data-qc-component="C01" data-qc-variant="ghost" data-qc-size="md" class="qc-button flex-1">Cancel</button><button type="button" disabled data-qc-component="C01" data-qc-variant="primary" data-qc-size="md" class="qc-button flex-1">Add Angle</button></div></div></div></div></dialog></main><script>document.querySelectorAll('dialog').forEach(d=>d.showModal());document.querySelectorAll('canvas').forEach(c=>{const x=c.getContext('2d');if(!x)return;x.fillStyle='#f8f9fa';x.fillRect(0,0,c.width,c.height);x.strokeStyle='#e6e8eb';x.lineWidth=1;for(let i=0;i<c.width;i+=25){x.beginPath();x.moveTo(i,0);x.lineTo(i,c.height);x.stroke()}for(let i=0;i<c.height;i+=25){x.beginPath();x.moveTo(0,i);x.lineTo(c.width,i);x.stroke()}x.font='14px system-ui';x.fillStyle='#596273';x.fillText('Static canvas placeholder. Drawing engine not exercised.',20,32)});</script></body></html>

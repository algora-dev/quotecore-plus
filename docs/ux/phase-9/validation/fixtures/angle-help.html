<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>angle-help</title><link rel="stylesheet" href="fixture.css"><style>body{margin:0;background:#f6f7f9}.specimen{max-width:1360px;margin:0 auto;padding:24px}.specimen-note{font:12px/18px Arial;color:#596273;padding:12px 16px;background:#fff;border-bottom:1px solid #dde1e7}.specimen-heading{font:600 26px/1.2 system-ui;margin:0 0 20px}canvas{background:#fff}@media(max-width:767px){.specimen{padding:20px 16px}}</style></head><body><div class="specimen-note">PHASE 9 SOURCE LAYOUT REVIEW · sample records · no live backend or drawing engine</div><main class="specimen" data-qc-ui="v2"><span class="qc-tool-help" data-qc-ui="v2"><button aria-label="Help: Change of Pitch" aria-haspopup="dialog" type="button" data-qc-component="C01" data-qc-variant="ghost" data-qc-size="sm" class="qc-button qc-icon-button"><span aria-hidden="true">?</span></button><dialog data-qc-ui="v2" data-qc-component="C27" data-qc-size="sm" class="qc-dialog " aria-modal="true" aria-labelledby="fixture-1"><header class="qc-dialog-header"><h2 id="fixture-1">Change of Pitch</h2></header><div class="qc-dialog-body"><img src="/angle-calculator/ChangeOfPitch.png" alt="Change of Pitch" class="qc-tool-help-image"><p class="qc-tool-help-copy">Use where one roof slope changes into another roof slope running in the same direction. Internal angles are measured on the inside of the fold. External angles are measured on the open side.</p></div><div class="qc-dialog-footer"><button type="button" data-qc-component="C01" data-qc-variant="ghost" data-qc-size="md" class="qc-button ">Close help</button></div></dialog></span></main><script>document.querySelectorAll('dialog').forEach(d=>d.showModal());document.querySelectorAll('canvas').forEach(c=>{const x=c.getContext('2d');if(!x)return;x.fillStyle='#f8f9fa';x.fillRect(0,0,c.width,c.height);x.strokeStyle='#e6e8eb';x.lineWidth=1;for(let i=0;i<c.width;i+=25){x.beginPath();x.moveTo(i,0);x.lineTo(i,c.height);x.stroke()}for(let i=0;i<c.height;i+=25){x.beginPath();x.moveTo(0,i);x.lineTo(c.width,i);x.stroke()}x.font='14px system-ui';x.fillStyle='#596273';x.fillText('Static canvas placeholder. Drawing engine not exercised.',20,32)});</script></body></html>

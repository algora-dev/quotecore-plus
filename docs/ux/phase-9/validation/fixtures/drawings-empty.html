<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>drawings-empty</title><link rel="stylesheet" href="fixture.css"><style>body{margin:0;background:#f6f7f9}.specimen{max-width:1360px;margin:0 auto;padding:24px}.specimen-note{font:12px/18px Arial;color:#596273;padding:12px 16px;background:#fff;border-bottom:1px solid #dde1e7}.specimen-heading{font:600 26px/1.2 system-ui;margin:0 0 20px}canvas{background:#fff}@media(max-width:767px){.specimen{padding:20px 16px}}</style></head><body><div class="specimen-note">PHASE 9 SOURCE LAYOUT REVIEW · sample records · no live backend or drawing engine</div><main class="specimen" data-qc-ui="v2"><h1 class="specimen-heading">Drawings / Images</h1><div data-qc-ui="v2" data-qc-component="C61" class="qc-journey "><div class="qc-drawing-library"><div data-qc-ui="v2" data-qc-component="C66" class="qc-action-feedback"><div aria-live="polite" aria-atomic="true"></div></div><div class="qc-drawing-library-heading"><div><h2 class="text-lg font-semibold">Your library</h2><p class="text-sm text-slate-500">0 drawings &amp; images</p><p class="text-xs text-slate-500">0/50 used</p></div><div class="qc-drawing-actions"><button data-copilot="create-drawing" title="Create a new drawing/image" type="button" data-qc-component="C01" data-qc-variant="primary" data-qc-size="md" class="qc-button ">Create drawing</button><button type="button" data-qc-component="C01" data-qc-variant="secondary" data-qc-size="md" class="qc-button ">Upload image</button></div></div><div class="qc-drawing-card text-center py-12"><h3 class="font-semibold">No drawings &amp; images yet</h3><p class="text-sm text-slate-500 mt-2">Create a drawing or upload an image to reuse in your material orders.</p></div></div></div></main><script>document.querySelectorAll('dialog').forEach(d=>d.showModal());document.querySelectorAll('canvas').forEach(c=>{const x=c.getContext('2d');if(!x)return;x.fillStyle='#f8f9fa';x.fillRect(0,0,c.width,c.height);x.strokeStyle='#e6e8eb';x.lineWidth=1;for(let i=0;i<c.width;i+=25){x.beginPath();x.moveTo(i,0);x.lineTo(i,c.height);x.stroke()}for(let i=0;i<c.height;i+=25){x.beginPath();x.moveTo(0,i);x.lineTo(c.width,i);x.stroke()}x.font='14px system-ui';x.fillStyle='#596273';x.fillText('Static canvas placeholder. Drawing engine not exercised.',20,32)});</script></body></html>

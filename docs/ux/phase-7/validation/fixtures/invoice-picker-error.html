<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>invoice-picker-error</title><link rel="stylesheet" href="fixture.css"><style>body{margin:0;background:#f6f7f9;font-family:Arial,sans-serif}.specimen{max-width:1200px;margin:0 auto;padding:28px 24px}.specimen-note{font:11px/18px Arial;color:#596273;padding:8px 16px;background:#fff;border-bottom:1px solid #dde1e7}.specimen:has(.qc-flow-auth){max-width:none;padding:0}@media(max-width:767px){.specimen{padding:20px 16px}}</style><body><div class="specimen-note">SOURCE-DERIVED STATIC FIXTURE · sample data · no saving, sending or payments</div><main class="specimen qc-main" data-qc-ui="v2"><nav class="qc-mobile-return" aria-label="Return navigation" data-qc-component="C65"><a href="/demo"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.65" strokeLinecap="round" strokeLinejoin="round"><path d="M20 12H4m6-6-6 6 6 6"></path></svg>Back to Home</a></nav><dialog data-qc-ui="v2" data-qc-component="C27" data-qc-size="md" class="qc-dialog qc-journey-dialog" aria-modal="true" aria-labelledby="fixture-1"><div class="qc-dialog-body"><span id="fixture-1" class="qc-flow-sr-only">Create invoice</span><div class="qc-flow-dialog-content"><div class="bg-white rounded-2xl shadow-2xl w-full max-w-md border border-slate-200"><div class="flex items-center justify-between px-6 pt-5 pb-4 border-b border-slate-100"><div class="flex items-center gap-2"><button aria-label="Back" type="button" class="qc-icon-button qc-flow-control p-1 rounded text-slate-400 hover:text-slate-700"><svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"></path></svg></button><h2 class="text-lg font-semibold text-slate-900">Invoice from Quote</h2></div><button aria-label="Close" type="button" class="qc-icon-button qc-flow-control p-1.5 rounded text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-colors"><svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg></button></div><div class="px-6 py-5"><div class="space-y-4"><p class="text-xs text-slate-500">Select the quote, then choose which lines to include on the next screen.</p><div class="relative"><svg class="absolute left-3 top-2.5 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg><input aria-label="Search quotes…" type="text" value="" placeholder="Search quotes…" autofocus class="qc-input qc-flow-search w-full pl-9 pr-3 py-2 rounded-lg border border-slate-300 text-sm focus:border-orange-500 focus:outline-none"></div><div class="max-h-60 overflow-y-auto rounded-lg border border-slate-200 divide-y divide-slate-100"><div class="qc-library-error" role="alert"><strong>Quotes could not be loaded</strong><p>Try again to choose an existing quote.</p><button type="button" class="qc-button qc-flow-control">Try again</button></div></div><div class="flex gap-3 pt-1"><button data-qc-variant="ghost" type="button" class="qc-flow-control qc-button flex-1 rounded-full border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">Back</button><button data-qc-variant="primary" type="button" disabled class="qc-flow-control qc-button flex-1 rounded-full bg-black px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800 disabled:opacity-50 transition-all">Select Lines →</button></div></div></div></div></div></div></dialog></main><script>for(const d of document.querySelectorAll('dialog')){d.showModal();}</script></body></html>

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>send-options</title><link rel="stylesheet" href="fixture.css"><style>body{margin:0;background:#f6f7f9;font-family:Arial,sans-serif}.specimen{max-width:1200px;margin:0 auto;padding:28px 24px}.specimen-note{font:11px/18px Arial;color:#596273;padding:8px 16px;background:#fff;border-bottom:1px solid #dde1e7}.specimen:has(.qc-flow-auth){max-width:none;padding:0}@media(max-width:767px){.specimen{padding:20px 16px}}</style><body><div class="specimen-note">SOURCE-DERIVED STATIC FIXTURE · sample data · no saving, sending or payments</div><main class="specimen qc-main" data-qc-ui="v2"><nav class="qc-mobile-return" aria-label="Return navigation" data-qc-component="C65"><a href="/demo"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.65" strokeLinecap="round" strokeLinejoin="round"><path d="M20 12H4m6-6-6 6 6 6"></path></svg>Back to Home</a></nav><dialog data-qc-ui="v2" data-qc-component="C27" data-qc-size="md" class="qc-dialog qc-journey-dialog" aria-modal="true" aria-labelledby="fixture-1"><div class="qc-dialog-body"><span id="fixture-1" class="qc-flow-sr-only">Send document</span><div class="qc-flow-dialog-content"><div class="bg-white rounded-xl p-6 max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto space-y-4"><div class="flex items-center justify-between"><h3 class="text-lg font-semibold text-slate-900">Send Quote to customer</h3><button aria-label="Close send dialog" class="qc-flow-control text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button></div><div class="space-y-3"><p class="text-sm text-slate-600">How would you like to send this quote?</p><div class="grid grid-cols-1 sm:grid-cols-2 gap-3"><button class="qc-flow-control qc-flow-card p-4 rounded-xl border-2 border-orange-300 bg-orange-50/50 hover:border-orange-400 hover:bg-orange-50 transition text-left space-y-2"><div class="w-10 h-10 rounded-full bg-orange-100 flex items-center justify-center"><svg class="w-5 h-5 text-orange-600" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M22 2 11 13"></path><path d="M22 2 15 22l-4-9-9-4 20-7Z"></path></svg></div><h4 class="text-sm font-semibold text-slate-900">Send from QuoteCore+</h4><p class="text-xs text-slate-500">Email the customer directly, branded as your company</p></button><button class="qc-flow-control qc-flow-card p-4 rounded-xl border-2 border-slate-200 hover:border-orange-300 hover:bg-orange-50/50 transition text-left space-y-2"><div class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center"><svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg></div><h4 class="text-sm font-semibold text-slate-900">Copy URL Link</h4><p class="text-xs text-slate-500">Copy the quote link to paste anywhere</p></button><button class="qc-flow-control qc-flow-card p-4 rounded-xl border-2 border-slate-200 hover:border-orange-300 hover:bg-orange-50/50 transition text-left space-y-2"><div class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center"><svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg></div><h4 class="text-sm font-semibold text-slate-900">Generate Email</h4><p class="text-xs text-slate-500">Generate email text to paste into your client</p></button></div></div></div></div></div></dialog></main><script>for(const d of document.querySelectorAll('dialog')){d.showModal();}</script></body></html>

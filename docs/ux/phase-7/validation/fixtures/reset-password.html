<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>reset-password</title><link rel="stylesheet" href="fixture.css"><style>body{margin:0;background:#f6f7f9;font-family:Arial,sans-serif}.specimen{max-width:1200px;margin:0 auto;padding:28px 24px}.specimen-note{font:11px/18px Arial;color:#596273;padding:8px 16px;background:#fff;border-bottom:1px solid #dde1e7}.specimen:has(.qc-flow-auth){max-width:none;padding:0}@media(max-width:767px){.specimen{padding:20px 16px}}</style><body><div class="specimen-note">SOURCE-DERIVED STATIC FIXTURE · sample data · no saving, sending or payments</div><main class="specimen qc-main" data-qc-ui="v2"><nav class="qc-mobile-return" aria-label="Return navigation" data-qc-component="C65"><a href="/demo"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.65" strokeLinecap="round" strokeLinejoin="round"><path d="M20 12H4m6-6-6 6 6 6"></path></svg>Back to Home</a></nav><div data-qc-ui="v2" data-qc-component="C61" class="qc-journey "><main class="qc-flow-auth flex items-center justify-center px-4 py-10"><div class="w-full max-w-md"><div class="text-center mb-8"><img src="/logo.png" alt="QuoteCore" class="h-12 inline-block"></div><div class="qc-flow-auth-card"><h1 class="text-2xl font-semibold text-slate-900 mb-2 text-center">Set New Password</h1><p class="text-sm text-slate-500 mb-6 text-center">Enter your new password below</p><form><div class="grid gap-4"><label class="qc-flow-label block"><span class="block text-sm font-medium text-slate-700 mb-1">New Password</span><div class="relative w-full"><input value="" minLength="8" required placeholder="••••••••" type="password" class="qc-input w-full px-4 py-3 pr-12 border-2 border-slate-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition-colors"><button type="button" tabindex="0" aria-label="Show value" aria-pressed="false" class="qc-flow-control qc-flow-password-toggle absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600 focus:outline-none focus:text-slate-700"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></div><p class="text-xs text-slate-500 mt-1">At least 8 characters</p></label><label class="qc-flow-label block"><span class="block text-sm font-medium text-slate-700 mb-1">Confirm Password</span><div class="relative w-full"><input value="" minLength="8" required placeholder="••••••••" type="password" class="qc-input w-full px-4 py-3 pr-12 border-2 border-slate-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition-colors"><button type="button" tabindex="0" aria-label="Show value" aria-pressed="false" class="qc-flow-control qc-flow-password-toggle absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600 focus:outline-none focus:text-slate-700"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></div></label><button data-qc-variant="primary" type="submit" class="qc-flow-control qc-button w-full px-6 py-3 bg-black text-white font-semibold rounded-lg hover:bg-slate-800 disabled:opacity-50 transition-colors">Update Password</button></div></form></div></div></main></div></main><script>for(const d of document.querySelectorAll('dialog')){d.showModal();}</script></body></html>

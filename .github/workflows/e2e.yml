name: E2E Tests

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Write .env.e2e
        run: |
          cat > .env.e2e << 'EOF'
          E2E_BASE_URL=https://quotecore-plus-dev.vercel.app
          E2E_TRIAL_A_EMAIL=${{ secrets.E2E_TRIAL_A_EMAIL }}
          E2E_TRIAL_A_PASSWORD=${{ secrets.E2E_TRIAL_A_PASSWORD }}
          E2E_TRIAL_A_SLUG=${{ secrets.E2E_TRIAL_A_SLUG }}
          E2E_STARTER_B_EMAIL=${{ secrets.E2E_STARTER_B_EMAIL }}
          E2E_STARTER_B_PASSWORD=${{ secrets.E2E_STARTER_B_PASSWORD }}
          E2E_STARTER_B_SLUG=${{ secrets.E2E_STARTER_B_SLUG }}
          E2E_PAID_C_EMAIL=${{ secrets.E2E_PAID_C_EMAIL }}
          E2E_PAID_C_PASSWORD=${{ secrets.E2E_PAID_C_PASSWORD }}
          E2E_PAID_C_SLUG=${{ secrets.E2E_PAID_C_SLUG }}
          E2E_CROSS_D_EMAIL=${{ secrets.E2E_CROSS_D_EMAIL }}
          E2E_CROSS_D_PASSWORD=${{ secrets.E2E_CROSS_D_PASSWORD }}
          E2E_CROSS_D_SLUG=${{ secrets.E2E_CROSS_D_SLUG }}
          E2E_ONBOARD_E_EMAIL=${{ secrets.E2E_ONBOARD_E_EMAIL }}
          E2E_ONBOARD_E_PASSWORD=${{ secrets.E2E_ONBOARD_E_PASSWORD }}
          E2E_ONBOARD_E_SLUG=${{ secrets.E2E_ONBOARD_E_SLUG }}
          E2E_ALLOW_EMAIL_SEND=false
          E2E_SAFE_RECIPIENT_EMAIL=${{ secrets.E2E_SAFE_RECIPIENT_EMAIL }}
          EOF

      - name: Run E2E tests
        run: npx playwright test --reporter=list
        env:
          E2E_BASE_URL: https://quotecore-plus-dev.vercel.app

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
